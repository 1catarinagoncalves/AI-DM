# US-93 gate 3 — smoke pós-deploy. Sem isto o CI termina verde sem saber se o que
# ele liberou para produção respondeu alguma coisa: o healthCheckPath do render.yaml
# é do Render, e o resultado dessa decisão mora no painel, não na aba de checks.
name: Smoke

# MANUAL, e não automático — medido em 05/08/2026, não é escolha de estilo.
#
# A primeira versão disparava por `workflow_run` do CI. Resultado no commit 130fc51:
# CI verde às 17:18:31, smoke rodando de 17:19 a 17:29, e o Render **nunca deployou** —
# a lista de deploys ficou parada no commit anterior. Com autoDeployTrigger: checksPass
# (US-92) o Render espera todos os checks do commit, e o check do `workflow_run` conta.
# O smoke esperava o deploy; o Render esperava o smoke. Deadlock, e produção parada no
# código de ontem.
#
# Um job dentro do ci.yml tem o mesmo problema por um caminho mais curto: o GitHub cria
# um check run por job.
#
# Daí manual. IMPORTANTE: rodar só DEPOIS de o deploy do Render aparecer como live —
# disparar antes recria o deadlock, porque este run também vira check do commit.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA que se espera em produção (vazio = topo da branch escolhida)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      # Poll com retry, nunca um curl seco: o Render Free hiberna por inatividade e o
      # primeiro request paga cold start (é a razão de existir da US-57). Um curl único
      # falharia por cold start e ensinaria que o passo é flaky.
      #
      # Compara o header X-Commit (apps/api/src/main.ts) com o SHA esperado. É o que
      # separa "há uma API viva" de "a API NOVA está viva": o processo antigo continua
      # respondendo 200 durante o build do Render.
      - name: Esperar a API nova responder
        env:
          SHA: ${{ inputs.sha || github.sha }}
          URL: https://ai-dm-api.onrender.com/api/v1/systems
        run: |
          # 40 x 15s = 10 min: cobre cold start com folga.
          for i in $(seq 1 40); do
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$URL" \
              | tr -d '\r' | awk 'tolower($1) == "x-commit:" { print $2 }')
            echo "tentativa $i/40: X-Commit=${got:-<sem resposta>} esperado=$SHA"
            if [ "$got" = "$SHA" ]; then
              echo "API nova no ar."
              exit 0
            fi
            sleep 15
          done
          echo "::error::timeout de 10 min: $URL nunca respondeu X-Commit=$SHA"
          exit 1
