# CI — US-80. Roda em todo push e PR, sem nenhum secret configurado.
# Passos separados de propósito (não `&&` numa linha): a aba de checks mostra
# QUAL etapa caiu sem precisar abrir o log.
name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # prisma.config.ts faz env('DATABASE_URL') no carregamento. `prisma generate`
      # não conecta ao banco, mas o config precisa da variável resolver.
      # Nenhum teste toca banco (US-80, Questões em aberto #2) — daí a URL fictícia.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      # fetch-depth: 0 por causa do guard do grafo lá embaixo: ele faz
      # `git log -- graphify-out/graph.json`, e o checkout raso (depth 1) não
      # traz histórico nenhum — o comando devolveria vazio e o guard calaria.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Antes do setup-node: `cache: pnpm` precisa do pnpm já no PATH.
      # Sem `version:` de propósito — o action lê `packageManager` do package.json
      # (pnpm@11.9.0). Declarar os dois faz o action falhar com "Multiple versions
      # of pnpm specified", e duplicar o pin convida à divergência.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.0 # casa com NODE_VERSION do render.yaml
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O client é gerado em apps/api/src/generated/ e é gitignored: sem isto o
      # typecheck da API não compila.
      # --fail-if-no-match em todo --filter: sem ele, filtro que não casa com
      # projeto nenhum imprime "No projects matched" e sai 0 — o passo fica verde
      # sem ter rodado nada. Pego em 29/07/2026 no `pnpm build` da raiz.
      - name: Gerar client Prisma
        run: pnpm --fail-if-no-match --filter api exec prisma generate

      # Antes do typecheck: apps/api importa @ai-dm/shared e @ai-dm/ai-engine, cujos
      # `types` apontam para dist/. Sem build, tsc dá TS2307 "Cannot find module
      # '@ai-dm/shared'" (medido em 27/07/2026, apagando os dois dist). O eval NÃO
      # depende disto — vitest.eval.config.ts faz alias dos dois pacotes para o src.
      - name: Build dos pacotes
        run: pnpm --fail-if-no-match --filter "./packages/*" build

      - run: pnpm typecheck

      - run: pnpm test

      # Gate de código morto (US-89): arquivo sem importador, dep declarada e
      # nunca importada, export de contrato sem consumidor. Reprova de verdade —
      # se um tipo de achado precisar ser parcado, é `--exclude <tipo>` no
      # knip.jsonc com o motivo escrito, nunca `continue-on-error` aqui.
      - name: Gate de código morto
        run: pnpm dead

      - run: pnpm eval

      # Gate completo de links (US-78 + US-79) e de nome de arquivo (US-82), mesmo
      # script. Era `--only-md` enquanto os 85 quebrados da US-79 existiam; ela
      # fechou em 27/07/2026 e o gate apertou. Sem `--fix` de propósito: um passo
      # de CI que reescreve arquivo sozinho não é gate.
      - name: Gate de docs
        run: pnpm docs:links

      # O `pnpm test` acima é recursivo pelos workspaces e não alcança a raiz;
      # este é o teste de regressão do modo de escrita do próprio gate (US-79).
      - name: Teste do gate de docs
        run: pnpm docs:links:test

      # Guard de drift da forma do sistema (US-83): módulo/pasta nova sem revisão
      # da seção Arquitetura do README. Também mora na raiz, fora do `pnpm test`.
      - name: Guard de drift do README
        run: pnpm docs:shape

      # Guard de frescor do grafo graphify. Aviso, NÃO falha: consertar exige
      # `graphify extract --backend gemini --force` local, que gasta chave e
      # dinheiro — reprovar um PR de doc por isso é desproporcional (diferente
      # do docs:links, cujo conserto é grátis).
      #
      # Compara por HISTÓRICO, não por mtime: num checkout limpo todo arquivo
      # nasce com o mesmo timestamp, então a heurística de mtime do iniciar.ps1
      # não vale aqui. A pergunta certa é "mudou .md em algum commit depois do
      # último commit que tocou graph.json?".
      - name: Guard de frescor do grafo
        run: |
          graph_commit=$(git log -1 --format=%H -- graphify-out/graph.json)
          if [ -z "$graph_commit" ]; then
            echo "graphify-out/graph.json não está versionado — guard ignorado."
            exit 0
          fi
          # Exclui graphify-out/: GRAPH_REPORT.md é SAÍDA do grafo e muda a cada
          # rebuild. Sem isto o guard se auto-dispara para sempre.
          stale=$(git diff --name-only "$graph_commit" HEAD -- '*.md' ':(exclude)graphify-out/*')
          if [ -n "$stale" ]; then
            count=$(echo "$stale" | wc -l)
            echo "::warning::$count doc(s) mudaram desde o último rebuild do grafo. Rode: graphify extract . --backend gemini --force && graphify label ."
            echo "$stale"
          else
            echo "Grafo em dia com os docs."
          fi
