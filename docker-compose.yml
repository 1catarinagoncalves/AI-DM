services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-dm-postgres
    environment:
      POSTGRES_USER: aidm
      POSTGRES_PASSWORD: aidm_dev
      POSTGRES_DB: ai_dm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-dm-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
