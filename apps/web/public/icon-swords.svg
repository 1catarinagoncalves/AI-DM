<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Espadas cruzadas: mesmo desenho do <Logo> (lucide `Swords`), redesenhado
       aqui em SVG estático porque o favicon não passa por React. Grid 24x24 do
       lucide escalado 6x e centrado (24*6=144, margem 18).
       Cores fixas, sem `prefers-color-scheme`: laranja é o token `primary` do
       tema escuro (oklch(0.68 0.16 55)) e o marrom fica entre `background` e
       `card` do mesmo tema. Hex e não oklch porque favicon é rasterizado fora
       do pipeline de CSS do app. Nada de hífen duplo neste comentário: XML
       rejeita, e o parser de SVG é XML. -->
  <rect width="180" height="180" rx="37" fill="#321f14" />
  <g transform="translate(18 18) scale(6)" fill="none" stroke="#e1791b"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
    <line x1="13" x2="19" y1="19" y2="13" />
    <line x1="16" x2="20" y1="16" y2="20" />
    <line x1="19" x2="21" y1="21" y2="19" />
    <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" />
    <line x1="5" x2="9" y1="14" y2="18" />
    <line x1="7" x2="4" y1="17" y2="20" />
    <line x1="3" x2="5" y1="19" y2="21" />
  </g>
</svg>
